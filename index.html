<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 주간 일정 & 결재 관리</title>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; padding: 20px;
        }
        .landing { text-align: center; color: white; }
        .landing h1 { font-size: 36px; margin-bottom: 12px; }
        .landing p { font-size: 16px; opacity: 0.85; margin-bottom: 48px; }
        .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
        .card {
            background: white; border-radius: 16px; padding: 40px 36px;
            width: 320px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none; color: inherit;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
        .card .icon { font-size: 48px; margin-bottom: 16px; }
        .card h2 { font-size: 20px; color: #333; margin-bottom: 10px; }
        .card p { font-size: 14px; color: #777; line-height: 1.6; }
        .card .arrow {
            display: inline-block; margin-top: 20px; padding: 10px 28px;
            border-radius: 8px; font-size: 14px; font-weight: 600;
        }
        .card:first-child .arrow { background: #667eea; color: white; }
        .card:last-child .arrow { background: #2d3561; color: white; }
    </style>
</head>
<body>
    <div class="landing">
        <h1>📋 미디어스페이스 시공개발팀 주간 일정 & 결재 관리</h1>
        <p>팀원 일정(업무/AS/휴가) 입력 + 결재 계획 관리를 한곳에서</p>
        <div class="cards">
            <a href="member.html" class="card">
                <div class="icon">✏️</div>
                <h2>팀원 입력 페이지</h2>
                <p>본인의 주간 일정을 입력하고<br>결재 계획(협력업체/금액)을<br>등록하세요.</p>
                <span class="arrow">내 일정 입력 →</span>
            </a>
            <a href="dashboard.html" class="card">
                <div class="icon">📊</div>
                <h2>관리자 통합 대시보드</h2>
                <p>전체 팀원 일정을 한눈에 보고<br>결재 금액 집계를<br>확인하세요.</p>
                <span class="arrow">대시보드 열기 →</span>
            </a>
        </div>
    </div>
</body>
</html>
